<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CRM · Вдало</title>
<link rel="icon" href="/img/app/favicon-64.png">
<link rel="manifest" href="/crm/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
<meta name="theme-color" content="#0b0c0e">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вдало">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#0d0f12;--muted:#667085;--line:#e4e7ec;--soft:#eef1f5;--green:#146c34;--red:#a11d1d;--amber:#8a5a00;--blue:#1f4fd1;
  --grad:linear-gradient(120deg,#c3e3f7 0%,#cdeee0 50%,#f6dbe4 100%);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none}
.logo span{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs[hidden],.tabs .n[hidden]{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--ink)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;line-height:18px;text-align:center}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
main{padding:20px;max-width:1840px;margin:0 auto}
.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.green{background:var(--green)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#98a2b3;margin-right:6px;vertical-align:1px}.dot.on{background:#16a34a;box-shadow:0 0 0 3px #16a34a33;animation:pulse 2s infinite}.dot.off{background:#d0d5dd}
@keyframes pulse{50%{box-shadow:0 0 0 6px #16a34a11}}
.warnline{background:#fff1f1;border:1px solid #f5c2c2;color:var(--red);border-radius:10px;padding:8px 12px;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:800;margin-left:4px;opacity:.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:57px;background:var(--surface);text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafbfc}
.tbl tr.row.stale td{background:#fdecec}
#d-cst::placeholder{color:#c4cad4;font-style:italic;font-weight:400}
.tbl small.cst{display:block;margin-top:4px;color:#344054;font-weight:700}
.tbl tr.row.stale td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tbl tr.row.stale:hover td{background:#fbe1e1}
.tbl small{display:block;color:var(--muted);margin-top:2px}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:700;font-size:12px;background:var(--soft);white-space:nowrap}
.st-new{background:#e5edff;color:var(--blue)}
.st-contacted,.st-in_progress{background:#fff2d6;color:var(--amber)}
.st-dialog{background:#e0f4f7;color:#0e6b7a}
.st-waiting{background:#fde8f1;color:#a61e5a}
.st-age{background:#eef0f4;color:#475467}
.st-novac{background:#f2f0fb;color:#5b4c9e}
.st-noans{background:#fdeee5;color:#c4320a}
.st-wrote{background:#e6f4ea;color:#2f6b3a}
.stm button.sub.sub-w{color:#2f6b3a}
.st-call{background:#ffe8d9;color:#b4480b}
button.st{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13px;padding:6px 26px 6px 12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;position:relative;text-align:left}
button.st::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;margin-top:-5px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.stm{position:fixed;z-index:40;min-width:340px;max-width:min(400px,calc(100vw - 16px));max-height:min(720px,calc(100vh - 16px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(16,24,40,.22);padding:8px}
.stm button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;font:inherit;font-size:16px;font-weight:600;color:var(--ink);padding:12px 14px;border-radius:11px;cursor:pointer;line-height:1.3}
.stm button:hover,.stm button:focus-visible{background:var(--soft);outline:0}
.stm button.on{background:#e5edff}
.stm button.on::after{content:"✓";margin-left:auto;color:var(--blue);font-weight:800}
.stm i{flex:none;width:12px;height:12px;border-radius:50%;background:currentColor}
.stm i.st-paid{background:var(--green)}
.stm button.sub{padding:8px 14px 8px 38px;font-size:15px;font-weight:500;color:#9b1c1c}
.stm button.sub i{width:6px;height:6px;opacity:.6}
.stm button.sub.sub-d{color:#0e6b7a}
.stm .own{color:var(--blue);font-weight:700;border-bottom:1px solid var(--line);border-radius:11px 11px 0 0;margin-bottom:6px;padding-bottom:14px}
.stm .own i{background:none;width:auto;height:auto;border-radius:0;font-style:normal;font-size:16px}
select.st{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12px;padding:4px 22px 4px 9px;max-width:280px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.tbl td.ck,.tbl th.ck{width:34px;padding-right:0}
.tbl input.ck{width:18px;height:18px;cursor:pointer;accent-color:var(--blue)}
.bulk{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:10px;border-radius:14px;background:#1d2939;color:#fff;box-shadow:0 8px 24px rgba(16,24,40,.18)}
.bulk select{padding:7px 10px;border-radius:999px;border:0;font-weight:600;background:#fff;color:#1d2939;max-width:240px}
.bulk .btn{padding:7px 14px;background:#2f6bff;color:#fff;border:0}
.bulk .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.st-matched,.st-departed{background:#efe5ff;color:#5b2bb5}
.st-working,.st-contract{background:#e2f5e9;color:var(--green)}
.st-paid,.st-done{background:var(--green);color:#fff}
.st-rejected{background:#f6e3e3;color:var(--red)}
.money{font-weight:800;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--surface);box-shadow:-20px 0 60px rgba(0,0,0,.15);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.shade{position:fixed;inset:0;background:rgba(13,15,18,.3);z-index:19;display:none}
.shade.open{display:block}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px;flex:1}
.db{padding:16px 20px;overflow:auto;flex:1;display:grid;gap:12px;align-content:start}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld{min-width:0}
.fld input{width:100%;box-sizing:border-box}
.db{overflow-x:hidden}
.fld select{max-width:100%;width:100%}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fld textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;background:var(--soft);border-radius:12px;padding:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat span{color:var(--muted);font-weight:600;font-size:12px}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.hl{background:var(--grad)}
.login{max-width:440px;margin:10vh auto;padding:32px;display:grid;gap:14px;text-align:center;justify-items:center}
.login h1{margin:0;font-size:24px}
.login p{margin:0;color:var(--muted)}
.err{color:var(--red);font-weight:600;min-height:1em}
.demo{background:#fff7d6;border:1px solid #f1d675;color:#5c4a00;border-radius:12px;padding:8px 12px;font-weight:600;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;display:none}
.toast.show{display:block}
.note{color:var(--muted);font-size:13px}
/* Чат співробітників */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font:inherit;color:var(--ink)}.seg button[aria-pressed=true]{background:#1f4fd1;color:#fff}
#mail-form input,#mail-form textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.chat.mailbox{height:auto;min-height:calc(100vh - 170px);grid-template-columns:320px 1fr;overflow:visible}
.mailbox .chat-l{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px)}
.mailbox .chat-r{min-width:0}
.mail-body{padding:12px 18px 18px}
@media (max-width:720px){.chat.mailbox{grid-template-columns:1fr}.mailbox .chat-l{position:static;max-height:40vh;display:block}}
.chat{display:grid;grid-template-columns:260px 1fr;padding:0;overflow:hidden;height:calc(100vh - 170px);min-height:460px}
.chat-l{border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.chat-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:12px;cursor:pointer;color:inherit;font:inherit}
.chat-i:hover{background:var(--soft,#f3f5f8)}.chat-i[aria-current="true"]{background:var(--soft,#eef1f4)}
.chat-i .n{margin-left:auto}
.chat-av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface,#fff);font-weight:700;position:relative}
.chat-av.on::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--surface,#fff)}
.chat-nm{display:flex;flex-direction:column;min-width:0}.chat-nm b,.chat-nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-nm small{color:var(--muted)}
.chat-r{display:flex;flex-direction:column;min-width:0}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}.chat-h small{color:var(--muted)}
.chat-m{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.chat-day{align-self:center;font-size:12px;color:var(--muted);background:var(--soft,#f3f5f8);border-radius:999px;padding:3px 10px;margin:6px 0}
.chat-msg{max-width:72%;align-self:flex-start;display:flex;flex-direction:column;gap:2px}
.chat-msg.me{align-self:flex-end;align-items:flex-end}
.chat-b{background:var(--soft,#f1f3f6);padding:9px 13px;border-radius:16px 16px 16px 4px;white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.chat-msg.me .chat-b{background:var(--ink);color:var(--surface,#fff);border-radius:16px 16px 4px 16px}
.chat-msg.me .chat-b a{color:inherit}
.chat-msg small{font-size:11px;color:var(--muted)}.chat-msg small a{color:var(--muted)}
.chat-who{font-size:12px;color:var(--muted);margin-left:4px}
.chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.chat-f textarea{flex:1;resize:none;border-radius:14px;min-height:44px;max-height:160px}
@media (max-width:720px){.chat{grid-template-columns:1fr;height:auto}.chat-l{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.chat-i{width:auto;flex:none}.chat-nm small{display:none}.chat-m{height:55vh}.chat-msg{max-width:88%}}

.binfo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--blue,#1f6feb);color:var(--blue,#1f6feb);background:transparent;font:700 12px/1 serif;font-style:italic;cursor:pointer;vertical-align:1px;margin-left:4px;padding:0}
.bnote{white-space:normal;text-align:left;max-width:320px;margin:6px 0 0 auto;font-size:12px;color:var(--muted);background:var(--soft,#f3f5f8);border-radius:10px;padding:8px 10px}
@media (max-width:800px){
  .top{flex-wrap:wrap;padding:10px 12px}.tabs{order:3;flex-basis:100%}main{padding:12px}
  .tbl thead{display:none}.tbl tr.row{display:grid;grid-template-columns:1fr auto;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl tr.row td{border:0;padding:2px 0}.tbl td.hide-m{display:none}.g2{grid-template-columns:1fr}
}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center}
.bars .t{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--ink);border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.cols i{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.pad .tbl th{position:static}
.mini input,.mini select,#t-who{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pad{padding:18px;display:grid;gap:12px;align-content:start}
.pad h3{margin:0}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}
.task.done b{text-decoration:line-through;color:var(--muted)}
.task small{display:block;color:var(--muted)}
.task .od{color:var(--red);font-weight:700}
.own-dlg{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.own-box{background:var(--surface);border-radius:18px;box-shadow:0 24px 64px rgba(16,24,40,.3);padding:22px;width:min(460px,100%);display:grid;gap:12px}
.own-box h3{margin:0;font-size:20px}
.own-box .note{margin:0}
.own-box input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:0}
.own-box input:focus{border-color:var(--blue)}
.own-act{display:flex;justify-content:flex-end;gap:8px}
.rej{display:grid;gap:8px}
.rej .btn{justify-content:flex-start;font-size:16px;padding:12px 14px;border-radius:12px}
.rej-own{display:grid;grid-template-columns:1fr auto;gap:8px}
.rej-own input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
td.tk{width:auto;min-width:220px;max-width:360px;cursor:default;padding-top:12px}
.tki{display:flex;gap:8px;align-items:flex-start;min-height:26px;font-size:13px;font-weight:600;line-height:1.25;cursor:pointer;border-radius:8px;padding:2px 6px;margin:0 -6px}
.tki:hover{background:var(--soft)}
.tki input[type=checkbox]{flex:none;width:16px;height:16px;margin:2px 0 0;accent-color:var(--green)}
.tki .tt{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;padding-top:1px}
.tki time{flex:none;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tki.od time{color:#fff;background:var(--red);border-radius:6px;padding:1px 6px}
.tki.od{color:#9b1c1c}
.tki.od input[type=checkbox]{accent-color:var(--red)}
.tkm{border:0;background:none;color:var(--blue);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0 2px 24px}
.tki.blank{color:var(--muted);cursor:text}
.tki.blank .pl{flex:none;width:16px;text-align:center;font-weight:800;font-size:15px}
.tki.blank .bt{flex:1;min-width:0;border:0;background:none;padding:2px 0;font:inherit;font-weight:500;color:var(--ink);outline:0}
.tki.blank .bt::placeholder{color:var(--muted)}
.tki.blank:focus-within{background:var(--soft)}
.chips-x{display:contents}
@media (max-width:800px){
  /* Кандидати: картка замість рядка таблиці */
  .tbl.lt tr.row{grid-template-columns:28px minmax(0,1fr);grid-template-areas:"ck who" ". st" ". nt" ". tk";column-gap:8px;row-gap:6px;padding:12px}
  .tbl.lt td.ck{grid-area:ck;padding-top:10px}
  .tbl.lt td.c-who{grid-area:who;min-width:0}
  .tbl.lt td.c-st{grid-area:st;min-width:0}
  .tbl.lt td.c-nt{grid-area:nt;display:block;width:auto;min-width:0;max-width:none;padding:0}
  .tbl.lt td.tk{grid-area:tk;display:block;width:auto;min-width:0;max-width:none;padding:2px 0 0}
  .tbl.lt td.tk .tki{margin:0;padding:3px 4px}
  .tbl.lt .who{justify-content:flex-start;text-align:left;min-width:0}
  .tbl.lt .who b{display:block;white-space:normal;overflow-wrap:anywhere}
  .tbl.lt button.st{max-width:100%;font-size:13px}
  .tbl.lt tr.row td,.tbl.lt tr.row:hover td,.tbl.lt tr.row.stale td{background:none;box-shadow:none}
  .tbl.lt tr.row.stale{background:#fdecec;box-shadow:inset 4px 0 0 var(--red)}
  /* фільтри статусів — один рядок, гортається вбік */
  .lbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lbar select{width:100%;min-width:0}
  .lbar .chips-x{display:flex;gap:6px;overflow-x:auto;grid-column:1/-1;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .lbar .chips-x::-webkit-scrollbar{display:none}
  .lbar .chip{flex:none;white-space:nowrap}
  /* таблиці без карток (аналітика, джерела): шапка видима, гортаються вбік */
  .tbl.tsx{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .tbl.tsx thead{display:table-header-group}
  .tbl.tsx th{position:static}
  .tbl.tsx tr.row{display:table-row;padding:0}
  .tbl.tsx tr.row td{padding:8px 10px;border-bottom:1px solid var(--line)}
  /* форми в один стовпчик */

<script src="/app/common.js"></script>
<script src="/app/crm-sources.js"></script>
<script>
(function(){
  var E = Vdalo.esc, M = Vdalo.money;
  var app = document.getElementById("app"), drawer = document.getElementById("drawer"), shade = document.getElementById("shade");
  var LS = [["new","Нова заявка"],["call","Чекає дзвінка"],["noans","Написали, подзвонили — не відповідає"],["wrote","Написали — чекаємо відповіді"],["contacted","На зв’язку"],["dialog","Ведеться діалог"],["waiting","Зідзвонились — чекає вакансію"],["age","Не підходить за віком"],["novac","Немає підходящих вакансій"],["matched","Підібрано вакансію"],["departed","Виїхав"],["working","Працює"],["paid","Відпрацював 2 тижні, оплату отримано"],["rejected","Відмова"]];
  var LSN = {}; LS.forEach(function(x){ LSN[x[0]] = x[1]; });
  var ES = [["new","Новий запит"],["in_progress","В роботі"],["contract","Співпрацюємо"],["rejected","Відмова"]];
  var ESN = {}; ES.forEach(function(x){ ESN[x[0]] = x[1]; });
  var ROLES = {user: "Користувач", manager: "Менеджер", admin: "Власник"};
  var S = {mgr: "all", tasks: [], staff: [], tab: "leads", leads: [], employers: [], people: [], payouts: [], bonus: 0, me: null, filter: "active", q: "", efilter: "all", sel: {}};

  function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove("show"); }, 2200); }
  function dt(d, time){ if (!d) return ""; var x = new Date(d); return x.toLocaleDateString("uk-UA", {day: "2-digit", month: "2-digit", year: "2-digit"}) + (time ? " " + x.toLocaleTimeString("uk-UA", {hour: "2-digit", minute: "2-digit"}) : ""); }
  function pname(p){ if (!p) return ""; return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(" ") || (p.tg_username ? "@" + p.tg_username : "—"); }
  /* Канали: безкоштовні (менеджер, соцмережі, рекомендації, SEO), реклама, прямий захід */
  var CH = {
    manager: ["Посилання менеджера", "#e2f5e9", "#146c34", "free"],
    social: ["Соцмережі / безкоштовні канали", "#e2f5e9", "#146c34", "free"],
    referral: ["Сарафанне радіо («Приведи друга»)", "#efe5ff", "#5b2bb5", "free"],
    seo: ["Пошук Google (SEO)", "#e5edff", "#1f4fd1", "free"],
    paid: ["Реклама", "#fff2d6", "#8a5a00", "paid"],
    direct: ["Прямий захід / знайшли самі", "#eef1f5", "#475467", "other"],
    other: ["Інші сайти", "#eef1f5", "#475467", "other"],
    manual: ["Додано вручну (дзвінок)", "#eef1f5", "#475467", "other"]
  };
  function chOf(l){
    if (l.traffic && CH[l.traffic]) return l.traffic;
    if (l.referrer_id) return "referral";
    var src = l.source || "";
    if (/вручну/.test(src)) return "manual";
    if (l.manager_id && l.ref_raw) return "manager";
    if (/google ads|facebook\/instagram|cpc|paid/i.test(src)) return "paid";
    if (/перехід з .*(google|bing|yahoo|duckduckgo)/i.test(src)) return "seo";
    if (/перехід з .*(t\.me|facebook|instagram|tiktok|viber|olx)/i.test(src) || /source=/.test(src)) return "social";
    if (/перехід з/.test(src)) return "other";
    return "direct";
  }
  // «Сам / сама» → «сам» або «сама» за ім'ям (якщо стать за ім'ям не зрозуміла — лишаємо як є)
  var MALE_A = /^(микола|никола|ілля|илья|ілья|нікіта|никита|лука|кузьма|фома|сава|савва|данила|гаврила|фока|хома|юра|вова|саня|ваня|петя|коля|толя|сергій?а?|жора|гоша|миша|міша|дима|діма|паша|леша|льоша|альоша|алеша|кирюша|илюша|ілюша|яша|гриша|гріша|тёма|тьома|сеня|веня|стёпа|стьопа|федя|костя|славік|мишаня)$/i;
  var UNI = /^(саша|женя|валя|слава|шура|сашко|ніка|ника)$/i;
  function sexBySurname(w){ w = w.toLowerCase();
    if (/(ова|ева|єва|іна|ина|ська|цька|зька|ая|яя)$/.test(w)) return "f";
    if (/(ов|ев|єв|ін|ин|ський|цький|зький|ский|цкий|ий|ой)$/.test(w)) return "m"; return ""; }
  function sexOf(name){
    var ws = String(name || "").trim().split(/[\s,]+/), f = (ws[0] || "").toLowerCase().replace(/[^a-zа-яіїєґё'’-]/g, "");
    if (!f) return "";
    if (UNI.test(f) || !/[а-яіїєґё]/.test(f) && !/[aeiouy]$/.test(f) && f.length < 5) return ws[1] ? sexBySurname(ws[1]) : "";
    if (MALE_A.test(f)) return "m";
    if (/[аяa]$/.test(f)) return "f";
    if (/(ія|іа|ia|ya)$/.test(f)) return "f";
    if (/^(любов|любовь|нінель|рахіль|рахиль|ассоль|адель|ізабель|изабель|юдіф|эстер|естер|кармен|ірен|ирэн|катрін|мішель)$/.test(f)) return "f";
    return /[бвгґджзйклмнпрстфхцчшщьъeoiuyrnsdtlmkvbhgzw]$/.test(f) ? "m" : "";
  }
  function whoTxt(l){ var w = String(l.who || ""); if (!/^\s*сам\s*\/\s*сама\s*$/i.test(w)) return w; var g = sexOf(l.name); return g === "m" ? "сам" : g === "f" ? "сама" : w.toLowerCase(); }
  function ageTxt(a){ a = String(a || "").trim(); var n = +a; if (!/^\d{1,3}$/.test(a)) return a; var d = n % 10, h = n % 100; return n + " " + (h >= 11 && h <= 14 ? "років" : d === 1 ? "рік" : d >= 2 && d <= 4 ? "роки" : "років"); }
  function chBadge(l){ var c = CH[chOf(l)]; return '<span class="st" style="background:' + c[1] + ';color:' + c[2] + '">' + E(c[0]) + '</span>'; }
  function waitStart(l){ return Math.max(new Date(l.created_at).getTime(), l.assigned_at ? new Date(l.assigned_at).getTime() : 0); }
  function mins(ms){ var m = Math.max(0, Math.round(ms / 6e4)); if (m < 60) return m + " хв"; var h = Math.floor(m / 60); if (h < 24) return h + " год " + (m % 60) + " хв"; return Math.floor(h / 24) + " д " + (h % 24) + " год"; }
  function respMs(l){ return l.first_contact_at ? new Date(l.first_contact_at).getTime() - waitStart(l) : null; }
  function median(a){ if (!a.length) return null; a = a.slice().sort(function(x, y){ return x - y; }); var m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
  function bonusRange(){ var st = S.st || {}; return M(+st.bonus_base || 2000) + " – " + M(+st.bonus_max || 4000); }
  function opts(list, v){ return list.map(function(x){ return '<option value="' + x[0] + '"' + (x[0] === v ? " selected" : "") + ">" + E(x[1]) + "</option>"; }).join(""); }

  /* ================= API ================= */
  function realApi(s, uid){
    function ok(r){ if (r.error) throw r.error; return r.data; }
    var REF = "referrer:profiles!leads_referrer_id_fkey(id,first_name,last_name,tg_username,ref_code,phone)";
    return {
      me: function(){ return s.from("profiles").select("*").eq("id", uid).maybeSingle().then(ok); },
      leads: function(){ return s.from("leads").select("*," + REF).order("created_at", {ascending: false}).limit(2000).then(ok); },
      events: function(lid){ return s.from("lead_events").select("*").eq("lead_id", lid).order("created_at", {ascending: false}).then(ok); },
      saveLead: function(lid, patch){ return s.from("leads").update(patch).eq("id", lid).then(ok); },
      saveLeads: function(ids, patch){ return s.from("leads").update(patch).in("id", ids).then(ok); },
      addLead: function(row){ return s.from("leads").insert(row).then(ok); },
      deleteLead: function(lid){ return s.from("leads").delete().eq("id", lid).then(ok); },
      employers: function(){ return s.from("employer_leads").select("*").order("created_at", {ascending: false}).limit(1000).then(ok); },
      saveEmployer: function(eid, patch){ return s.from("employer_leads").update(patch).eq("id", eid).then(ok); },
      people: function(){ return s.from("user_balances").select("*").order("balance", {ascending: false}).limit(2000).then(ok); },
      ledger: function(u){ return s.from("ledger").select("*").eq("user_id", u).order("created_at", {ascending: false}).then(ok); },
      payouts: function(){
        return Promise.all([s.from("payout_requests").select("*").order("created_at", {ascending: false}).limit(500).then(ok), s.from("user_balances").select("id,first_name,last_name,tg_username,phone,balance").then(ok)])
          .then(function(r){ var by = {}; r[1].forEach(function(p){ by[p.id] = p; }); return r[0].map(function(x){ return Object.assign({}, x, {user: by[x.user_id], balance: by[x.user_id] ? by[x.user_id].balance : 0}); }); });
      },
      makePayout: function(u, a, note, req){ return s.rpc("make_payout", {p_user: u, p_amount: a, p_note: note, p_request: req || null}).then(ok); },
      rejectPayout: function(req){ return s.from("payout_requests").update({status: "rejected"}).eq("id", req).then(ok); },
      setRole: function(u, role){ return s.from("profiles").update({role: role}).eq("id", u).then(ok); },
      promoteManagers: function(list){ if (!list.length) return Promise.resolve();
        return s.from("profiles").select("id,tg_username,role").eq("role", "user").then(ok).then(function(ps){
          var ids = ps.filter(function(p){ return p.tg_username && list.indexOf(p.tg_username.toLowerCase()) >= 0; }).map(function(p){ return p.id; });
          return ids.length ? s.from("profiles").update({role: "manager"}).in("id", ids).then(ok) : null; }); },
      settings: function(){ return s.from("settings").select("*").then(ok).then(function(r){ var o = {}; r.forEach(function(x){ o[x.key] = x.value; }); return o; }); },
      setSetting: function(k, v){ return s.from("settings").upsert({key: k, value: String(v)}).then(ok); },
      findRef: function(code){ return s.from("profiles").select("id,first_name,last_name,tg_username,ref_code").eq("ref_code", code.toLowerCase()).maybeSingle().then(ok); },
      saveMe: function(patch){ return s.from("profiles").update(patch).eq("id", uid).then(ok); },
      pay: function(){ return s.from("vacancy_pay").select("*").limit(5000).then(ok); },
      chatPeople: function(){ return s.rpc("chat_people").then(ok); },
      chatUnread: function(){ return s.rpc("chat_unread").then(ok); },
      chatMsgs: function(room){ return s.from("chat_messages").select("*").eq("room", room).order("id", {ascending: false}).limit(200).then(ok).then(function(r){ return r.reverse(); }); },
      chatSend: function(room, body){ return s.from("chat_messages").insert({room: room, body: body}).select().single().then(ok); },
      chatDel: function(id){ return s.from("chat_messages").delete().eq("id", id).then(ok); },
      chatRead: function(room, last){ return s.from("chat_reads").upsert({user_id: uid, room: room, last_id: last}, {onConflict: "user_id,room"}).then(ok); },
      chatSub: function(fn){ return s.channel("chat-" + uid).on("postgres_changes", {event: "INSERT", schema: "public", table: "chat_messages"}, function(p){ fn(p.new); }).subscribe(); },
      mailList: function(){ return s.from("mail_messages").select("id,dir,from_addr,from_name,to_addr,subject,text_body,read_at,created_at,sent_by").order("id", {ascending: false}).limit(300).then(ok); },
      mailGet: function(id){ return s.from("mail_messages").select("*").eq("id", id).single().then(ok); },
      mailRead: function(id){ return s.from("mail_messages").update({read_at: new Date().toISOString()}).eq("id", id).is("read_at", null).then(ok); },
      mailDel: function(id){ return s.from("mail_messages").delete().eq("id", id).then(ok); },
      mailUnread: function(){ return s.from("mail_messages").select("id", {count: "exact", head: true}).eq("dir", "in").is("read_at", null).then(function(r){ if (r.error) throw r.error; return r.count || 0; }); },
      metaLeads: function(){ return s.functions.invoke("meta-leads", {body: {}}).then(function(r){ if (r.error) throw r.error; return r.data; }); },
      mailSend: function(body){ return s.functions.invoke("mail-send", {body: body}).then(function(r){
        if (r.error) { var c = r.error.context; return (c && c.json ? c.json() : Promise.resolve({})).then(function(j){ throw new Error(j && j.error || r.error.message); }); }
        if (r.data && r.data.error) throw new Error(r.data.error); return r.data; }); },
      mailSub: function(fn){ return s.channel("mail-" + uid).on("postgres_changes", {event: "INSERT", schema: "public", table: "mail_messages"}, function(p){ fn(p.new); }).subscribe(); },
      hasSecret: function(k){ return s.rpc("has_secret", {p_key: k}).then(ok); },
      setSecret: function(k, v){ return s.rpc("set_secret", {p_key: k, p_value: v}).then(ok); },
      payRank: function(){ return s.rpc("vacancy_pay_rank").then(ok); },
      savePay: function(rows){ return s.from("vacancy_pay").upsert(rows, {onConflict: "id"}).then(ok); },
      staff: function(){ return s.from("profiles").select("id,first_name,last_name,full_name,tg_username,role,ref_code,last_seen_at").in("role", ["manager", "admin"]).then(ok); },
      tasks: function(){ return s.from("tasks").select("*").order("due_at", {ascending: true, nullsFirst: false}).limit(2000).then(ok); },
      addTask: function(row){ return s.from("tasks").insert(row).then(ok); },
      saveTask: function(tid, patch){ return s.from("tasks").update(patch).eq("id", tid).then(ok); },
      deleteTask: function(tid){ return s.from("tasks").delete().eq("id", tid).then(ok); },
      ledgerAll: function(){ return s.from("ledger").select("kind,amount,created_at").limit(10000).then(ok); },
      ping: function(){ return s.rpc("crm_ping").then(ok); },
      workLog: function(d1, d2){ return s.from("work_log").select("*").gte("day", d1).lte("day", d2).then(ok); },
      eventsSince: function(t){ return s.from("lead_events").select("actor_id,created_at,new_status").gte("created_at", t).limit(20000).then(ok); },
      logout: function(){ try { localStorage.removeItem("vdalo-staff"); } catch (e) {} s.auth.signOut().then(function(){ location.reload(); }); }
    };
  }

  var API;

  /* ================= Вхід ================= */
  function loginScreen(msg){
    app.innerHTML = '<div class="card login"><h1>CRM «Вдало»</h1><p>' + E(msg || "Увійдіть через Telegram. Доступ мають лише менеджери.") + '</p><div id="tg"></div><p class="err" id="lerr"></p>' +
      '</div>';
    Vdalo.tgLogin(document.getElementById("tg"), function(){ location.reload(); }, function(m){ document.getElementById("lerr").textContent = m; });
  }
  function boot(){
    Vdalo.sb().then(function(s){
      if (!s) { app.innerHTML = '<div class="card login"><h1>CRM ще не підключено</h1><p>Заповніть config.json (адреса й ключ Supabase, ім’я бота).</p></div>'; return; }
      s.auth.getSession().then(function(r){
        var ses = r.data.session; if (!ses) return loginScreen();
        API = realApi(s, ses.user.id); start();
      });
    });
  }
  function start(){
    API.me().then(function(me){
      if (!me || (me.role !== "manager" && me.role !== "admin")) {
        app.innerHTML = '<div class="card login"><h1>Немає доступу</h1><p>Ваш акаунт ' + E(pname(me)) + ' ще не має ролі менеджера. Попросіть власника додати ваш Telegram-нік у CRM (Налаштування → Менеджери).</p><button class="btn ghost" id="out">Вийти</button></div>';
        document.getElementById("out").onclick = function(){ API.logout(); }; return;
      }
      S.me = me; S.own = me.role === "admin";
      try { localStorage.setItem("vdalo-staff", "1"); } catch (e) {}
      if (!S.own && !me.onboarded_at) { managerForm(true); return; }
      document.querySelectorAll("#tabs [data-own]").forEach(function(b){ b.hidden = !S.own; });
      document.getElementById("t-leads").textContent = S.own ? "Кандидати" : "Мої кандидати";
      document.getElementById("t-pay").textContent = S.own ? "Оплата за кандидата" : "Пріоритетні вакансії";
      API.staff().then(function(st){ S.staff = st; }).catch(function(){});
      API.settings().then(function(st){ S.st = st; }).catch(function(){});
      document.getElementById("me").innerHTML = E(me.full_name || pname(me)) + ' · ' + E(ROLES[me.role]) + (S.own ? "" : ' <button class="btn ghost sm" id="my-form">Моя анкета</button>') + ' <button class="btn ghost sm" id="out">Вийти</button>';
      var mf = document.getElementById("my-form"); if (mf) mf.onclick = function(){ managerForm(false); };
      document.getElementById("out").onclick = function(){ API.logout(); };
      document.getElementById("tabs").hidden = false;
      document.querySelectorAll("#tabs button").forEach(function(b){ b.onclick = function(){ go(b.getAttribute("data-tab")); }; });
      var h = location.hash.replace("#", "");
      if (S.own && /^paysync=/.test(h)) { paySync(h.slice(8)); h = "pay"; }
      else if (S.own && /^paysyncz=/.test(h)) { // стиснуті дані (gzip + base64url) — коротке посилання
        try { var bb = atob(h.slice(9).replace(/-/g, "+").replace(/_/g, "/")), u = Uint8Array.from(bb, function(c){ return c.charCodeAt(0); });
          new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text().then(function(t){ paySync(encodeURIComponent(t)); }).catch(fail);
        } catch (e) { fail(e); }
        h = "pay"; }
      go(tabsAllowed().indexOf(h) >= 0 ? h : "leads");
      counts(); heartbeat();
    });
  }
  /* ---------- Присутність: пінг раз на хвилину, коли вкладка відкрита й людина щось робила за 5 хв ---------- */
  var lastAct = Date.now();
  ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(function(ev){ document.addEventListener(ev, function(){ lastAct = Date.now(); }, {passive: true, capture: true}); });
  function heartbeat(){
    var beat = function(){ if (document.visibilityState === "visible" && Date.now() - lastAct < 5 * 6e4) API.ping().catch(function(){}); };
    beat(); setInterval(beat, 60000);
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") { lastAct = Date.now(); beat(); } });
  }
  /* ---------- Анкета менеджера ---------- */
  function managerForm(first){
    var me = S.me, f = me.manager_form || {};
    var chk = function(name, list, sel){ return '<div class="bar" style="margin:0">' + list.map(function(x){ var on = (sel || []).indexOf(x) >= 0;
      return '<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" name="' + name + '" value="' + E(x) + '"' + (on ? " checked" : "") + '>' + E(x) + '</label>'; }).join("") + '</div>'; };
    var sel = function(id, list, v){ return '<select id="' + id + '"><option value="">Оберіть…</option>' + list.map(function(x){ return '<option' + (v === x ? " selected" : "") + '>' + E(x) + '</option>'; }).join("") + '</select>'; };
    document.getElementById("tabs").hidden = true;
    app.innerHTML = '<div class="card" style="max-width:760px;margin:0 auto;padding:clamp(18px,4vw,32px);display:grid;gap:14px">' +
      '<h2 style="margin:0">' + (first ? "Анкета менеджера" : "Моя анкета") + '</h2>' +
      '<p class="note" style="margin:0">' + (first ? "Перед початком роботи заповніть, будь ласка, анкету. Це займе хвилину." : "Оновіть дані, якщо щось змінилося.") + '</p>' +
      '<div class="g2"><div class="fld"><label>Ім’я та прізвище *</label><input id="m-name" value="' + E(me.full_name || [me.first_name, me.last_name].filter(Boolean).join(" ")) + '"></div>' +
      '<div class="fld"><label>Телефон *</label><input id="m-phone" type="tel" placeholder="+380 …" value="' + E(me.phone || "") + '"></div></div>' +
      '<div class="g2"><div class="fld"><label>E-mail</label><input id="m-email" type="email" value="' + E(me.email || "") + '"></div>' +

  function dueAt(off){
    var d = new Date();
    if (off === "today18" || off === "today20") { d.setHours(off === "today18" ? 18 : 20, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); return d; }
    d = new Date(Date.now() + off);
    if (off >= D) { d.setHours(10, 0, 0, 0); }   // задачі «на день» — на 10:00
    return d;
  }
  function localInput(d){ var p = function(n){ return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }

      var L = all.filter(function(l){ return inR(l.created_at); });
      var reached = function(l){ return ["departed", "working", "paid"].indexOf(l.status) >= 0; };
      var workedF = function(l){ return l.status === "working" || l.status === "paid"; };
      var pct = function(a, b){ return b ? Math.round(a / b * 100) + "%" : "—"; };
      var nW = L.filter(workedF).length;
      var chStat = Object.keys(CH).map(function(k){ var a = L.filter(function(l){ return chOf(l) === k; }); return {k: k, n: a.length, w: a.filter(workedF).length}; }).filter(function(x){ return x.n; }).sort(function(a, b){ return b.n - a.n; });
      var maxSrc = Math.max.apply(null, chStat.map(function(x){ return x.n; }).concat([1]));
      var freeN = L.filter(function(l){ return CH[chOf(l)][3] === "free"; }).length, paidN = L.filter(function(l){ return chOf(l) === "paid"; }).length;
      var cnt = {}; L.forEach(function(l){ cnt[l.status] = (cnt[l.status] || 0) + 1; });

        '<b>Рух коштів</b><ul class="hist">' + (g.length ? g.map(function(x){ return '<li>' + E(dt(x.created_at, true)) + ' · ' + E({bonus: "Бонус", payout: "Виплата", adjust: "Коригування"}[x.kind] || x.kind) + ' <b>' + (x.amount > 0 ? "+" : "") + E(M(x.amount)) + '</b>' + (x.note ? " · " + E(x.note) : "") + '</li>'; }).join("") : "<li>Порожньо</li>") + '</ul>' +
        '<b>Запрошені</b><ul class="hist">' + (S.leads.filter(function(l){ return l.referrer_id === uid; }).map(function(l){ return '<li>' + E(l.name) + ' · ' + E(LSN[l.status]) + '</li>'; }).join("") || "<li>Нікого</li>") + '</ul></div>');
      drawer.querySelectorAll("[data-x]").forEach(function(b){ b.onclick = closeDrawer; });
    }).catch(fail);
  }

  /* ================= Виплати ================= */
  function rPayouts(){
    Promise.all([API.payouts(), API.people()]).then(function(r){
      S.payouts = r[0]; S.people = r[1];
      var nw = r[0].filter(function(x){ return x.status === "new"; }), old = r[0].filter(function(x){ return x.status !== "new"; });
      function rows(list, actions){
        return list.length ? list.map(function(x){
          return '<tr><td class="hide-m">' + E(dt(x.created_at, true)) + '</td><td><b>' + E(pname(x.user)) + '</b><small>' + E(x.contact || "") + '</small></td><td class="money">' + E(M(x.amount)) + '</td>' +
            '<td class="hide-m money">' + E(M(x.balance)) + '</td><td>' + (actions ? '<button class="btn sm green" data-ok="' + x.id + '">Виплачено</button> <button class="btn sm ghost" data-no="' + x.id + '">Відхилити</button>'
            : '<span class="st st-' + x.status + '">' + (x.status === "done" ? "Виплачено" : "Відхилено") + '</span>') + '</td></tr>';
        }).join("") : '<tr><td colspan="5" class="empty">' + (actions ? "Нових запитів немає" : "Порожньо") + '</td></tr>';
      }
      var head = '<thead><tr><th>Дата</th><th>Учасник</th><th>Сума</th><th>Баланс</th><th></th></tr></thead>';
      app.innerHTML = demoBar() + '<h3>Нові запити на виплату</h3><div class="card"><table class="tbl">' + head + '<tbody>' + rows(nw, true) + '</tbody></table></div>' +
        '<h3 style="margin-top:24px">Оброблені</h3><div class="card"><table class="tbl">' + head + '<tbody>' + rows(old, false) + '</tbody></table></div>';
      document.querySelectorAll("[data-ok]").forEach(function(b){ b.onclick = function(){ var x = S.payouts.filter(function(p){ return p.id === +b.getAttribute("data-ok"); })[0]; payDialog(x.user_id, x.id); }; });
      document.querySelectorAll("[data-no]").forEach(function(b){ b.onclick = function(){ if (confirm("Відхилити запит?")) API.rejectPayout(+b.getAttribute("data-no")).then(function(){ counts(); rPayouts(); }).catch(fail); }; });
    }).catch(fail);
  }

  /* ================= Налаштування ================= */
  function rSettings(){
    API.settings().then(function(st){
      S.st = st;
      var isAdmin = S.me.role === "admin", dis = isAdmin ? "" : " disabled";
      var base = +st.bonus_base || 2000, step = +st.bonus_step || 200, mx = +st.bonus_max || 4000;
      var ex = []; for (var i = 0; i < 6; i++) ex.push((i + 1) + "-й — " + M(Math.min(base + step * i, mx)));
      app.innerHTML = demoBar() + '<div class="card" style="padding:20px;max-width:620px;display:grid;gap:12px"><h3 style="margin:0">Бонус «Приведи друга»</h3>' +
        '<div class="g2"><div class="fld"><label>Перший друг у місяці, грн</label><input id="s-base" type="number" min="0" value="' + base + '"' + dis + '></div>' +
        '<div class="fld"><label>Кожен наступний — більше на, грн</label><input id="s-step" type="number" min="0" value="' + step + '"' + dis + '></div></div>' +
        '<div class="fld"><label>Максимум за одного друга, грн</label><input id="s-max" type="number" min="0" value="' + mx + '"' + dis + '></div>' +
        '<p class="note">Зараз: ' + E(ex.join(" · ")) + ' … і так до максимуму ' + E(M(mx)) + '. Щомісяця (за київським часом) відлік починається знову.</p>' +
        '<p class="note">Бонус нараховується автоматично, коли кандидату, який прийшов за посиланням, ставлять статус «Відпрацював 2 тижні, оплату отримано».</p>' +
        (isAdmin ? '<button class="btn" id="s-save" style="justify-self:start">Зберегти</button>' : '<p class="note">Змінювати може лише адміністратор.</p>') + '</div>' +
        '<div class="card" style="padding:20px;max-width:620px;margin-top:16px;display:grid;gap:10px"><h3 style="margin:0">Менеджери</h3>' +
        '<div class="fld"><label>Telegram-ніки менеджерів (через кому, без @)</label><textarea id="s-mgr" placeholder="ivan_manager, olena_vdalo"' + dis + '>' + E(st.manager_tg || "") + '</textarea></div>' +
        '<p class="note">Людина з цим ніком, увійшовши на сайті через Telegram (значок кабінету або /crm/), одразу потрапить у CRM як менеджер. Прибрати доступ — змініть роль на «Користувач» у вкладці «Реферали й баланси».</p>' +
        (isAdmin ? '<button class="btn" id="s-mgr-save" style="justify-self:start">Зберегти менеджерів</button>' : '') + '</div>' +
        (isAdmin ? '<div class="card" style="padding:20px;max-width:620px;margin-top:16px;display:grid;gap:10px"><h3 style="margin:0">Заявки з форм Facebook / Instagram</h3>' +
          '<p class="note" id="fb-st">Перевіряю…</p>' +
          '<p class="note">Нові заявки з рекламних форм кожні 2 хв самі потрапляють сюди в «Заявки» (джерело «Форма Facebook/Instagram») і в Telegram-групу «Вдало Заявки» разом із Google-таблицею.</p>' +
          '<div class="row2" style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="fb-tok" type="password" autocomplete="off" placeholder="Вставте сюди ключ сторінки (починається з EAA)" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;min-width:0"><button class="btn" id="fb-key">Зберегти ключ</button></div>' +
          '<div class="bar" style="margin:0"><button class="btn ghost" id="fb-run">Перевірити зараз</button></div></div>' : '') +
        '<div class="card" style="padding:20px;max-width:620px;margin-top:16px;display:grid;gap:12px"><h3 style="margin:0">Робочий час менеджерів</h3>' +
        '<div class="g2"><div class="fld"><label>Початок дня</label><input id="w-s" type="time" value="' + E(st.work_start || "10:00") + '"' + dis + '></div>' +
        '<div class="fld"><label>Кінець дня</label><input id="w-e" type="time" value="' + E(st.work_end || "17:00") + '"' + dis + '></div></div>' +
        '<div class="fld"><label>Робочі дні</label><div class="bar" style="margin:0">' + [1, 2, 3, 4, 5, 6, 7].map(function(d){ var on = String(st.work_days || "1,2,3,4,5").split(/[\s,]+/).indexOf(String(d)) >= 0;
          return '<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" name="w-d" value="' + d + '"' + (on ? " checked" : "") + dis + '>' + DN[d] + '</label>'; }).join("") + '</div></div>' +
        '<div class="g2"><div class="fld"><label>Попереджати про простій після, хв</label><input id="w-i" type="number" min="10" value="' + E(st.idle_min || "45") + '"' + dis + '></div>' +
        '<div class="fld"><label>Запізнення — якщо немає після початку, хв</label><input id="w-l" type="number" min="0" value="' + E(st.late_min === undefined ? "30" : st.late_min) + '"' + dis + '></div></div>' +
        '<p class="note">Сповіщення надсилає бот @vdalo_robota_bot усім власникам, кожні 10 хв у робочий час, і підсумок дня після його завершення. Якщо повідомлення не приходять — відкрийте бота й натисніть «Start».</p>' +
        (isAdmin ? '<button class="btn" id="w-save" style="justify-self:start">Зберегти робочий час</button>' : '') + '</div>';
      var fbSt = document.getElementById("fb-st");
      if (fbSt) {
        API.hasSecret("meta_page_token").then(function(ok){ fbSt.innerHTML = ok ? "✅ Ключ сторінки збережено." : "<b>Ще не підключено.</b> Натисніть «Вставити ключ сторінки»."; }).catch(function(){ fbSt.textContent = ""; });
        document.getElementById("fb-key").onclick = function(){
          var inp = document.getElementById("fb-tok"), v = inp.value.trim();
          if (!v) { inp.focus(); return toast("Вставте ключ у поле (Ctrl+V)"); } if (!/^EAA/.test(v)) return toast("Ключ має починатися з EAA");
          API.setSecret("meta_page_token", v).then(function(){ inp.value = ""; toast("Ключ збережено ✅"); fbSt.innerHTML = "✅ Ключ сторінки збережено. Перевіряю заявки…"; document.getElementById("fb-run").click(); }).catch(fail);
        };
        document.getElementById("fb-run").onclick = function(){
          fbSt.textContent = "Перевіряю заявки у Facebook…";
          API.metaLeads()
            .then(function(j){ fbSt.innerHTML = j.error ? "⚠️ " + E(j.error) : (j.ok ? "✅ " : "⚠️ ") + "Форм: " + j.forms + ", заявок за 14 днів: " + j.seen + ", нових додано: " + j.added + (j.errors && j.errors.length ? "<br>" + E(j.errors.join("; ")) : ""); })
            .catch(function(e){ fbSt.textContent = "Не вдалося звернутися до функції" + (e && e.message ? ": " + e.message : "."); });
        };
      }
      var wsv = document.getElementById("w-save");
      if (wsv) wsv.onclick = function(){
        var v = function(id){ return document.getElementById(id).value; };
        var dd = [].map.call(document.querySelectorAll('input[name="w-d"]:checked'), function(i){ return i.value; });
        if (!/^\d{2}:\d{2}$/.test(v("w-s")) || !/^\d{2}:\d{2}$/.test(v("w-e")) || v("w-s") >= v("w-e")) { toast("Перевірте години роботи"); return; }
        if (!dd.length) { toast("Оберіть хоча б один робочий день"); return; }
        Promise.all([API.setSetting("work_start", v("w-s")), API.setSetting("work_end", v("w-e")), API.setSetting("work_days", dd.join(",")),
          API.setSetting("idle_min", Math.max(10, parseInt(v("w-i"), 10) || 45)), API.setSetting("late_min", Math.max(0, parseInt(v("w-l"), 10) || 0))])
          .then(function(){ toast("Робочий час збережено"); rSettings(); }).catch(fail);
      };
      var ms = document.getElementById("s-mgr-save");
      if (ms) ms.onclick = function(){
        var list = document.getElementById("s-mgr").value.split(/[\s,]+/).map(function(x){ return x.trim().replace(/^@/, "").toLowerCase(); }).filter(Boolean);
        API.setSetting("manager_tg", list.join(", ")).then(function(){ return API.promoteManagers(list); })
          .then(function(){ toast("Менеджерів збережено"); rSettings(); }).catch(fail);
      };
      var sv = document.getElementById("s-save");
      if (sv) sv.onclick = function(){
        var v = function(id){ return Math.max(0, parseInt(document.getElementById(id).value, 10) || 0); };
        Promise.all([API.setSetting("bonus_base", v("s-base")), API.setSetting("bonus_step", v("s-step")), API.setSetting("bonus_max", v("s-max"))])
          .then(function(){ toast("Збережено"); rSettings(); }).catch(fail);
      };
    }).catch(fail);
  }

  setInterval(function(){
    if (!S.me || drawer.classList.contains("open")) return;
    var a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
    counts(); if (S.tab === "leads") rLeads();
  }, 60000);
  boot();
})();
</script>
</body>
</html>
