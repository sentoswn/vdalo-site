<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · Вдало</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#0d0f12;--muted:#667085;--line:#e4e7ec;--soft:#eef1f5;--green:#146c34;--red:#a11d1d;--amber:#8a5a00;--blue:#1f4fd1;
  --grad:linear-gradient(120deg,#c3e3f7 0%,#cdeee0 50%,#f6dbe4 100%);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none}
.logo span{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs[hidden],.tabs .n[hidden]{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--ink)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;line-height:18px;text-align:center}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
main{padding:20px;max-width:1500px;margin:0 auto}
.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:800;margin-left:4px;opacity:.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:57px;background:var(--surface);text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafbfc}
.tbl small{display:block;color:var(--muted);margin-top:2px}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:700;font-size:12px;background:var(--soft);white-space:nowrap}
.st-new{background:#e5edff;color:var(--blue)}
.st-contacted,.st-in_progress{background:#fff2d6;color:var(--amber)}
.st-matched,.st-departed{background:#efe5ff;color:#5b2bb5}
.st-working,.st-contract{background:#e2f5e9;color:var(--green)}
.st-paid,.st-done{background:var(--green);color:#fff}
.st-rejected{background:#f6e3e3;color:var(--red)}
.money{font-weight:800;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--surface);box-shadow:-20px 0 60px rgba(0,0,0,.15);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.shade{position:fixed;inset:0;background:rgba(13,15,18,.3);z-index:19;display:none}
.shade.open{display:block}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px;flex:1}
.db{padding:16px 20px;overflow:auto;flex:1;display:grid;gap:12px;align-content:start}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fld textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;background:var(--soft);border-radius:12px;padding:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat span{color:var(--muted);font-weight:600;font-size:12px}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.hl{background:var(--grad)}
.login{max-width:440px;margin:10vh auto;padding:32px;display:grid;gap:14px;text-align:center;justify-items:center}
.login h1{margin:0;font-size:24px}
.login p{margin:0;color:var(--muted)}
.err{color:var(--red);font-weight:600;min-height:1em}
.demo{background:#fff7d6;border:1px solid #f1d675;color:#5c4a00;border-radius:12px;padding:8px 12px;font-weight:600;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;display:none}
.toast.show{display:block}
.note{color:var(--muted);font-size:13px}
@media (max-width:800px){
  .top{flex-wrap:wrap;padding:10px 12px}.tabs{order:3;flex-basis:100%}main{padding:12px}
  .tbl thead{display:none}.tbl tr.row{display:grid;grid-template-columns:1fr auto;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl tr.row td{border:0;padding:2px 0}.tbl td.hide-m{display:none}.g2{grid-template-columns:1fr}
}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center}
.bars .t{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--ink);border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.cols i{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.pad .tbl th{position:static}
.mini input,.mini select,#t-who{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pad{padding:18px;display:grid;gap:12px;align-content:start}
.pad h3{margin:0}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}
.task.done b{text-decoration:line-through;color:var(--muted)}
.task small{display:block;color:var(--muted)}
.task .od{color:var(--red);font-weight:700}
.tgroup{padding:10px 12px 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mini{display:grid;gap:6px}
.mini .row2{display:grid;grid-template-columns:1fr 150px auto;gap:6px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}.bars .b{grid-template-columns:120px 1fr 44px}.mini .row2{grid-template-columns:1fr}}
.guide{max-width:900px;display:grid;gap:16px}
.guide .card{padding:clamp(16px,3vw,26px);display:grid;gap:10px}
.guide h3{margin:0;font-size:18px}
.guide h4{margin:8px 0 0;font-size:15px}
.guide p,.guide li{line-height:1.55}
.guide ul,.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}
.guide .tpl{background:var(--soft);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.guide .tpl-row{display:grid;gap:6px}
.guide .warn{background:#fff4e5;border:1px solid #f3d29a;border-radius:12px;padding:12px 14px}
.guide nav{display:flex;flex-wrap:wrap;gap:6px}
.guide nav a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:13px}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/"><span>В</span>CRM</a>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" data-tab="leads" aria-selected="true"><span id="t-leads">Кандидати</span><span class="n" id="n-leads" hidden></span></button>
    <button role="tab" data-tab="tasks">Задачі<span class="n" id="n-tasks" hidden></span></button>
    <button role="tab" data-tab="analytics" data-own>Аналітика</button>
    <button role="tab" data-tab="employers" data-own>Роботодавці<span class="n" id="n-employers" hidden></span></button>
    <button role="tab" data-tab="people" data-own>Реферали й баланси</button>
    <button role="tab" data-tab="payouts" data-own>Виплати<span class="n" id="n-payouts" hidden></span></button>
    <button role="tab" data-tab="mylink">Моє посилання</button>
    <button role="tab" data-tab="guide">Як шукати кандидатів</button>
    <button role="tab" data-tab="settings" data-own>Налаштування</button>
  </nav>
  <div class="me" id="me"></div>
</header>
<main id="app"><div class="empty">Завантаження…</div></main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script src="/app/common.js"></script>
<script>
(function(){
  var E = Vdalo.esc, M = Vdalo.money;
  var app = document.getElementById("app"), drawer = document.getElementById("drawer"), shade = document.getElementById("shade");
  var LS = [["new","Нова заявка"],["contacted","На зв’язку"],["matched","Підібрано вакансію"],["departed","Виїхав"],["working","Працює"],["paid","Відпрацював 2 тижні, оплату отримано"],["rejected","Відмова"]];
  var LSN = {}; LS.forEach(function(x){ LSN[x[0]] = x[1]; });
  var ES = [["new","Новий запит"],["in_progress","В роботі"],["contract","Співпрацюємо"],["rejected","Відмова"]];
  var ESN = {}; ES.forEach(function(x){ ESN[x[0]] = x[1]; });
  var ROLES = {user: "Користувач", manager: "Менеджер", admin: "Власник"};
  var S = {mgr: "all", tasks: [], staff: [], tab: "leads", leads: [], employers: [], people: [], payouts: [], bonus: 0, me: null, filter: "active", q: "", efilter: "all"};

  function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove("show"); }, 2200); }
  function dt(d, time){ if (!d) return ""; var x = new Date(d); return x.toLocaleDateString("uk-UA", {day: "2-digit", month: "2-digit", year: "2-digit"}) + (time ? " " + x.toLocaleTimeString("uk-UA", {hour: "2-digit", minute: "2-digit"}) : ""); }
  function pname(p){ if (!p) return ""; return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(" ") || (p.tg_username ? "@" + p.tg_username : "—"); }
  function bonusRange(){ var st = S.st || {}; return M(+st.bonus_base || 2000) + " – " + M(+st.bonus_max || 4000); }
  function opts(list, v){ return list.map(function(x){ return '<option value="' + x[0] + '"' + (x[0] === v ? " selected" : "") + ">" + E(x[1]) + "</option>"; }).join(""); }

  /* ================= API ================= */
  function realApi(s, uid){
    function ok(r){ if (r.error) throw r.error; return r.data; }
    var REF = "referrer:profiles!leads_referrer_id_fkey(id,first_name,last_name,tg_username,ref_code,phone)";
    return {
      me: function(){ return s.from("profiles").select("*").eq("id", uid).maybeSingle().then(ok); },
      leads: function(){ return s.from("leads").select("*," + REF).order("created_at", {ascending: false}).limit(2000).then(ok); },
      events: function(lid){ return s.from("lead_events").select("*").eq("lead_id", lid).order("created_at", {ascending: false}).then(ok); },
      saveLead: function(lid, patch){ return s.from("leads").update(patch).eq("id", lid).then(ok); },
      addLead: function(row){ return s.from("leads").insert(row).then(ok); },
      deleteLead: function(lid){ return s.from("leads").delete().eq("id", lid).then(ok); },
      employers: function(){ return s.from("employer_leads").select("*").order("created_at", {ascending: false}).limit(1000).then(ok); },
      saveEmployer: function(eid, patch){ return s.from("employer_leads").update(patch).eq("id", eid).then(ok); },
      people: function(){ return s.from("user_balances").select("*").order("balance", {ascending: false}).limit(2000).then(ok); },
      ledger: function(u){ return s.from("ledger").select("*").eq("user_id", u).order("created_at", {ascending: false}).then(ok); },
      payouts: function(){
        return Promise.all([s.from("payout_requests").select("*").order("created_at", {ascending: false}).limit(500).then(ok), s.from("user_balances").select("id,first_name,last_name,tg_username,phone,balance").then(ok)])
          .then(function(r){ var by = {}; r[1].forEach(function(p){ by[p.id] = p; }); return r[0].map(function(x){ return Object.assign({}, x, {user: by[x.user_id], balance: by[x.user_id] ? by[x.user_id].balance : 0}); }); });
      },
      makePayout: function(u, a, note, req){ return s.rpc("make_payout", {p_user: u, p_amount: a, p_note: note, p_request: req || null}).then(ok); },
      rejectPayout: function(req){ return s.from("payout_requests").update({status: "rejected"}).eq("id", req).then(ok); },
      setRole: function(u, role){ return s.from("profiles").update({role: role}).eq("id", u).then(ok); },
      promoteManagers: function(list){ if (!list.length) return Promise.resolve();
        return s.from("profiles").select("id,tg_username,role").eq("role", "user").then(ok).then(function(ps){
          var ids = ps.filter(function(p){ return p.tg_username && list.indexOf(p.tg_username.toLowerCase()) >= 0; }).map(function(p){ return p.id; });
          return ids.length ? s.from("profiles").update({role: "manager"}).in("id", ids).then(ok) : null; }); },
      settings: function(){ return s.from("settings").select("*").then(ok).then(function(r){ var o = {}; r.forEach(function(x){ o[x.key] = x.value; }); return o; }); },
      setSetting: function(k, v){ return s.from("settings").upsert({key: k, value: String(v)}).then(ok); },
      findRef: function(code){ return s.from("profiles").select("id,first_name,last_name,tg_username,ref_code").eq("ref_code", code.toLowerCase()).maybeSingle().then(ok); },
      saveMe: function(patch){ return s.from("profiles").update(patch).eq("id", uid).then(ok); },
      staff: function(){ return s.from("profiles").select("id,first_name,last_name,full_name,tg_username,role,ref_code").in("role", ["manager", "admin"]).then(ok); },
      tasks: function(){ return s.from("tasks").select("*").order("due_at", {ascending: true, nullsFirst: false}).limit(2000).then(ok); },
      addTask: function(row){ return s.from("tasks").insert(row).then(ok); },
      saveTask: function(tid, patch){ return s.from("tasks").update(patch).eq("id", tid).then(ok); },
      deleteTask: function(tid){ return s.from("tasks").delete().eq("id", tid).then(ok); },
      ledgerAll: function(){ return s.from("ledger").select("kind,amount,created_at").limit(10000).then(ok); },
      logout: function(){ s.auth.signOut().then(function(){ location.reload(); }); }
    };
  }

  var API;

  /* ================= Вхід ================= */
  function loginScreen(msg){
    app.innerHTML = '<div class="card login"><h1>CRM «Вдало»</h1><p>' + E(msg || "Увійдіть через Telegram. Доступ мають лише менеджери.") + '</p><div id="tg"></div><p class="err" id="lerr"></p>' +
      '</div>';
    Vdalo.tgLogin(document.getElementById("tg"), function(){ location.reload(); }, function(m){ document.getElementById("lerr").textContent = m; });
  }
  function boot(){
    Vdalo.sb().then(function(s){
      if (!s) { app.innerHTML = '<div class="card login"><h1>CRM ще не підключено</h1><p>Заповніть config.json (адреса й ключ Supabase, ім’я бота).</p></div>'; return; }
      s.auth.getSession().then(function(r){
        var ses = r.data.session; if (!ses) return loginScreen();
        API = realApi(s, ses.user.id); start();
      });
    });
  }
  function start(){
    API.me().then(function(me){
      if (!me || (me.role !== "manager" && me.role !== "admin")) {
        app.innerHTML = '<div class="card login"><h1>Немає доступу</h1><p>Ваш акаунт ' + E(pname(me)) + ' ще не має ролі менеджера. Попросіть власника додати ваш Telegram-нік у CRM (Налаштування → Менеджери).</p><button class="btn ghost" id="out">Вийти</button></div>';
        document.getElementById("out").onclick = function(){ API.logout(); }; return;
      }
      S.me = me; S.own = me.role === "admin";
      if (!S.own && !me.onboarded_at) { managerForm(true); return; }
      document.querySelectorAll("#tabs [data-own]").forEach(function(b){ b.hidden = !S.own; });
      document.getElementById("t-leads").textContent = S.own ? "Кандидати" : "Мої кандидати";
      API.staff().then(function(st){ S.staff = st; }).catch(function(){});
      API.settings().then(function(st){ S.st = st; }).catch(function(){});
      document.getElementById("me").innerHTML = E(me.full_name || pname(me)) + ' · ' + E(ROLES[me.role]) + (S.own ? "" : ' <button class="btn ghost sm" id="my-form">Моя анкета</button>') + ' <button class="btn ghost sm" id="out">Вийти</button>';
      var mf = document.getElementById("my-form"); if (mf) mf.onclick = function(){ managerForm(false); };
      document.getElementById("out").onclick = function(){ API.logout(); };
      document.getElementById("tabs").hidden = false;
      document.querySelectorAll("#tabs button").forEach(function(b){ b.onclick = function(){ go(b.getAttribute("data-tab")); }; });
      var h = location.hash.replace("#", ""); go(tabsAllowed().indexOf(h) >= 0 ? h : "leads");
      counts();
    });
  }
  /* ---------- Анкета менеджера ---------- */
  function managerForm(first){
    var me = S.me, f = me.manager_form || {};
    var chk = function(name, list, sel){ return '<div class="bar" style="margin:0">' + list.map(function(x){ var on = (sel || []).indexOf(x) >= 0;
      return '<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" name="' + name + '" value="' + E(x) + '"' + (on ? " checked" : "") + '>' + E(x) + '</label>'; }).join("") + '</div>'; };
    var sel = function(id, list, v){ return '<select id="' + id + '"><option value="">Оберіть…</option>' + list.map(function(x){ return '<option' + (v === x ? " selected" : "") + '>' + E(x) + '</option>'; }).join("") + '</select>'; };
    document.getElementById("tabs").hidden = true;
    app.innerHTML = '<div class="card" style="max-width:760px;margin:0 auto;padding:clamp(18px,4vw,32px);display:grid;gap:14px">' +
      '<h2 style="margin:0">' + (first ? "Анкета менеджера" : "Моя анкета") + '</h2>' +
      '<p class="note" style="margin:0">' + (first ? "Перед початком роботи заповніть, будь ласка, анкету. Це займе хвилину." : "Оновіть дані, якщо щось змінилося.") + '</p>' +
      '<div class="g2"><div class="fld"><label>Ім’я та прізвище *</label><input id="m-name" value="' + E(me.full_name || [me.first_name, me.last_name].filter(Boolean).join(" ")) + '"></div>' +
      '<div class="fld"><label>Телефон *</label><input id="m-phone" type="tel" placeholder="+380 …" value="' + E(me.phone || "") + '"></div></div>' +
      '<div class="g2"><div class="fld"><label>E-mail</label><input id="m-email" type="email" value="' + E(me.email || "") + '"></div>' +
      '<div class="fld"><label>Місто, область *</label><input id="m-city" value="' + E(me.city || "") + '"></div></div>' +
      '<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="m-ok1"' + (me.consent_at ? " checked" : "") + '> <span>Погоджуюся на обробку моїх персональних даних *</span></label>' +
      '<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="m-ok2"' + (f.nda ? " checked" : "") + '> <span>Зобов’язуюся не передавати контакти кандидатів і дані з CRM третім особам та використовувати їх лише для роботи з «Вдало» *</span></label>' +

      ];

      app.innerHTML = '<div class="card pad" style="margin-bottom:16px"><h3>Нова задача</h3><div class="mini"><div class="row2" style="grid-template-columns:1fr 190px ' + (S.own ? "180px " : "") + 'auto">' +
        '<input id="t-title" placeholder="Що зробити? Напр. знайти 10 людей на склад SHEIN">' + '<input id="t-due" type="datetime-local">' + assignSel + '<button class="btn" id="t-add">Додати</button></div></div></div>' +
        (S.own ? '<div class="bar"><button class="chip" data-tw="all" aria-pressed="' + (who === "all") + '">Усі</button>' + S.staff.map(function(p){ return '<button class="chip" data-tw="' + p.id + '" aria-pressed="' + (who === p.id) + '">' + E(pname(p)) + '<b>' + r[0].filter(function(t){ return !t.done_at && t.assignee_id === p.id; }).length + '</b></button>'; }).join("") + '</div>' : "") +
        '<div class="card" id="tl">' + groups.map(function(g){ return g[1].length ? '<div class="tgroup">' + E(g[0]) + ' · ' + g[1].length + '</div>' + g[1].map(taskRow).join("") : ""; }).join("") +
        (open.length || groups[4][1].length ? "" : '<div class="empty">Задач немає. Додайте першу вище або в картці кандидата.</div>') + '</div>';

  /* ================= Аналітика (власники) ================= */
  function rAnalytics(){
    Promise.all([API.leads(), API.tasks(), API.employers(), API.ledgerAll(), API.staff()]).then(function(r){
      var all = r[0], tasks = r[1], emps = r[2], ledger = r[3]; S.staff = r[4];
      var days = S.period || 30, from = days === "all" ? 0 : Date.now() - days * 864e5;
      var L = all.filter(function(l){ return new Date(l.created_at).getTime() >= from; });
      var reached = function(l){ return ["departed", "working", "paid"].indexOf(l.status) >= 0; };
      var workedF = function(l){ return l.status === "working" || l.status === "paid"; };
      var pct = function(a, b){ return b ? Math.round(a / b * 100) + "%" : "—"; };
      var nW = L.filter(workedF).length;
      var src = {"Посилання менеджерів": 0, "Рекомендації («Приведи друга»)": 0, "Сайт і реклама": 0, "Додано вручну": 0};
      L.forEach(function(l){
        if (l.referrer_id) src["Рекомендації («Приведи друга»)"]++;
        else if (/вручну/.test(l.source || "")) src["Додано вручну"]++;
        else if (l.manager_id && l.ref_raw) src["Посилання менеджерів"]++;
        else src["Сайт і реклама"]++;
      });
      var maxSrc = Math.max.apply(null, Object.keys(src).map(function(k){ return src[k]; }).concat([1]));
      var cnt = {}; L.forEach(function(l){ cnt[l.status] = (cnt[l.status] || 0) + 1; });
      // по днях (останні 30)
      var byDay = []; for (var i = 29; i >= 0; i--) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); byDay.push({d: d, n: 0}); }
      all.forEach(function(l){ var t = new Date(l.created_at); t.setHours(0, 0, 0, 0); byDay.forEach(function(b){ if (b.d.getTime() === t.getTime()) b.n++; }); });
      var maxDay = Math.max.apply(null, byDay.map(function(b){ return b.n; }).concat([1]));
      // менеджери
      var now = new Date();
      var rows = S.staff.map(function(p){
        var m = L.filter(function(l){ return l.manager_id === p.id; });
        var od = tasks.filter(function(t){ return t.assignee_id === p.id && !t.done_at && t.due_at && new Date(t.due_at) < now; }).length;
        return {p: p, n: m.length, act: m.filter(function(l){ return ["new", "contacted", "matched"].indexOf(l.status) >= 0; }).length,
          dep: m.filter(reached).length, w: m.filter(workedF).length, paid: m.filter(function(l){ return l.status === "paid"; }).length,
          rej: m.filter(function(l){ return l.status === "rejected"; }).length, od: od};
      }).sort(function(a, b){ return b.w - a.w || b.n - a.n; });
      var un = L.filter(function(l){ return !l.manager_id; }).length;
      var bonusAcc = ledger.filter(function(g){ return g.kind === "bonus" && new Date(g.created_at).getTime() >= from; }).reduce(function(a, g){ return a + g.amount; }, 0);
      var bonusPaid = -ledger.filter(function(g){ return g.kind === "payout" && new Date(g.created_at).getTime() >= from; }).reduce(function(a, g){ return a + g.amount; }, 0);
      var bonusDue = ledger.reduce(function(a, g){ return a + g.amount; }, 0);
      var per = [[7, "7 днів"], [30, "30 днів"], [90, "90 днів"], ["all", "Увесь час"]];
      app.innerHTML = '<div class="bar">' + per.map(function(x){ return '<button class="chip" data-per="' + x[0] + '" aria-pressed="' + (String(days) === String(x[0])) + '">' + x[1] + '</button>'; }).join("") + '</div>' +
        '<div class="stats">' +
        '<div class="card stat"><span>Заявок</span><b>' + L.length + '</b></div>' +
        '<div class="card stat"><span>Без менеджера</span><b>' + un + '</b></div>' +
        '<div class="card stat"><span>Виїхали</span><b>' + L.filter(reached).length + '</b></div>' +
        '<div class="card stat hl"><span>Вийшли на роботу</span><b>' + nW + ' <small style="font-size:14px">(' + pct(nW, L.length) + ')</small></b></div>' +
        '<div class="card stat"><span>Оплачено роботодавцем</span><b>' + (cnt.paid || 0) + '</b></div>' +
        '<div class="card stat"><span>Запитів роботодавців</span><b>' + emps.filter(function(e){ return new Date(e.created_at).getTime() >= from; }).length + '</b></div></div>' +
        '<div class="card pad" style="margin-bottom:16px"><h3>Менеджери</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Менеджер</th><th>Кандидатів</th><th>В роботі</th><th>Виїхали</th><th>Працюють</th><th>Оплачено</th><th>Відмови</th><th>Конверсія</th><th>Прострочені задачі</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function(x){ return '<tr><td><b>' + E(pname(x.p)) + '</b><small>' + E(ROLES[x.p.role]) + (x.p.tg_username ? " · @" + E(x.p.tg_username) : "") + '</small></td><td>' + x.n + '</td><td>' + x.act + '</td><td>' + x.dep + '</td><td>' + x.w + '</td><td>' + x.paid + '</td><td>' + x.rej + '</td><td><b>' + pct(x.w, x.n) + '</b></td><td>' + (x.od ? '<span class="st st-rejected">' + x.od + '</span>' : "0") + '</td></tr>'; }).join("") : '<tr><td colspan="9" class="empty">Менеджерів ще немає</td></tr>') +
        '</tbody></table></div></div>' +
        '<div class="grid2"><div class="card pad"><h3>Воронка</h3><div class="bars">' + LS.map(function(x){ var n = cnt[x[0]] || 0; return '<div class="b"><span>' + E(x[1]) + '</span><div class="t"><i style="width:' + (L.length ? Math.round(n / L.length * 100) : 0) + '%"></i></div><b>' + n + '</b></div>'; }).join("") + '</div></div>' +
        '<div class="card pad"><h3>Звідки кандидати</h3><div class="bars">' + Object.keys(src).map(function(k){ return '<div class="b"><span>' + E(k) + '</span><div class="t"><i style="width:' + Math.round(src[k] / maxSrc * 100) + '%"></i></div><b>' + src[k] + '</b></div>'; }).join("") + '</div></div>' +
        '<div class="card pad"><h3>Заявки за останні 30 днів</h3><div class="cols">' + byDay.map(function(b){ return '<i style="height:' + Math.round(b.n / maxDay * 100) + '%" data-t="' + E(dt(b.d)) + ': ' + b.n + '"></i>'; }).join("") + '</div><p class="note">Наведіть на стовпчик, щоб побачити дату й кількість.</p></div>' +
        '<div class="card pad"><h3>Бонуси «Приведи друга»</h3><div class="stats" style="margin:0"><div class="card stat"><span>Нараховано за період</span><b>' + E(M(bonusAcc)) + '</b></div><div class="card stat"><span>Виплачено за період</span><b>' + E(M(bonusPaid)) + '</b></div><div class="card stat hl"><span>Борг до виплати зараз</span><b>' + E(M(bonusDue)) + '</b></div></div></div></div>';
      document.querySelectorAll("[data-per]").forEach(function(b){ b.onclick = function(){ var v = b.getAttribute("data-per"); S.period = v === "all" ? "all" : +v; rAnalytics(); }; });
    }).catch(fail);
  }

  /* ================= Роботодавці ================= */
  function rEmployers(){
    API.employers().then(function(list){
      S.employers = list;
      var cnt = {}; list.forEach(function(x){ cnt[x.status] = (cnt[x.status] || 0) + 1; });
      var rows = list.filter(function(x){ return S.efilter === "all" || x.status === S.efilter; });
      app.innerHTML = demoBar() + '<div class="bar"><button class="chip" data-f="all" aria-pressed="' + (S.efilter === "all") + '">Усі<b>' + list.length + '</b></button>' +
        ES.map(function(x){ return '<button class="chip" data-f="' + x[0] + '" aria-pressed="' + (S.efilter === x[0]) + '">' + E(x[1]) + '<b>' + (cnt[x[0]] || 0) + '</b></button>'; }).join("") + '</div>' +
        '<div class="card"><table class="tbl"><thead><tr><th>Дата</th><th>Компанія</th><th>Потреба</th><th>Контакт</th><th>Статус</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function(x){
          return '<tr class="row" data-id="' + x.id + '"><td class="hide-m">' + E(dt(x.created_at, true)) + '</td><td><b>' + E(x.company) + '</b><small>' + E([x.country, x.city].filter(Boolean).join(", ")) + '</small></td>' +
            '<td class="hide-m">' + E(x.workers ? x.workers + " ос. · " : "") + E((x.positions || "").slice(0, 90)) + '</td><td class="hide-m">' + E(x.contact_name || "") + '<small>' + E([x.phone, x.email].filter(Boolean).join(" · ")) + '</small></td>' +
            '<td><span class="st st-' + x.status + '">' + E(ESN[x.status] || x.status) + '</span></td></tr>';
        }).join("") : '<tr><td colspan="5" class="empty">Запитів поки немає</td></tr>') + '</tbody></table></div>';
      document.querySelectorAll("[data-f]").forEach(function(b){ b.onclick = function(){ S.efilter = b.getAttribute("data-f"); rEmployers(); }; });
      document.querySelectorAll("tr.row").forEach(function(tr){ tr.onclick = function(){ openEmployer(+tr.getAttribute("data-id")); }; });
    }).catch(fail);
  }
  function openEmployer(id){
    var x = S.employers.filter(function(e){ return e.id === id; })[0]; if (!x) return;
    openDrawer('<div class="dh"><h2>' + E(x.company) + '</h2><button class="btn ghost sm" data-x>✕</button></div><div class="db">' +
      '<dl class="kv"><dt>Запит</dt><dd>' + E(dt(x.created_at, true)) + '</dd><dt>Контакт</dt><dd>' + E(x.contact_name || "—") + '</dd>' +
      '<dt>Телефон</dt><dd>' + (x.phone ? '<a href="tel:' + E(x.phone.replace(/[^\d+]/g, "")) + '">' + E(x.phone) + '</a>' : "—") + '</dd><dt>E-mail</dt><dd>' + (x.email ? '<a href="mailto:' + E(x.email) + '">' + E(x.email) + '</a>' : "—") + '</dd>' +
      '<dt>Де</dt><dd>' + E([x.country, x.city].filter(Boolean).join(", ") || "—") + '</dd><dt>Скільки людей</dt><dd>' + E(x.workers || "—") + '</dd>' +
      '<dt>Коли</dt><dd>' + E(x.start_when || "—") + '</dd><dt>Позиції</dt><dd>' + E(x.positions || "—") + '</dd><dt>Коментар</dt><dd>' + E(x.note || "—") + '</dd><dt>Мова сайту</dt><dd>' + E(x.lang || "uk") + '</dd></dl>' +
      '<div class="fld"><label>Статус</label><select id="e-st">' + opts(ES, x.status) + '</select></div>' +
      '<div class="fld"><label>Нотатки менеджера</label><textarea id="e-note">' + E(x.manager_note || "") + '</textarea></div></div>' +
      '<div class="df"><button class="btn ghost" data-x>Скасувати</button><button class="btn" id="e-save">Зберегти</button></div>');
    drawer.querySelectorAll("[data-x]").forEach(function(b){ b.onclick = closeDrawer; });
    document.getElementById("e-save").onclick = function(){
      API.saveEmployer(x.id, {status: document.getElementById("e-st").value, manager_note: document.getElementById("e-note").value.trim() || null})
        .then(function(){ toast("Збережено"); closeDrawer(); counts(); rEmployers(); }).catch(fail);
    };
  }

  /* ================= Реферали й баланси ================= */
  function rPeople(){
    API.people().then(function(list){
      S.people = list;
      var total = list.reduce(function(a, p){ return a + (p.balance || 0); }, 0), earned = list.reduce(function(a, p){ return a + (p.earned || 0); }, 0);
      var isAdmin = S.me.role === "admin";
      app.innerHTML = demoBar() + '<div class="stats"><div class="card stat"><span>Учасників</span><b>' + list.length + '</b></div>' +
        '<div class="card stat"><span>Нараховано бонусів усього</span><b>' + E(M(earned)) + '</b></div><div class="card stat hl"><span>До виплати зараз</span><b>' + E(M(total)) + '</b></div></div>' +
        '<div class="bar"><input type="search" id="pq" placeholder="Пошук: ім’я, нік, телефон, код"></div>' +
        '<div class="card"><table class="tbl"><thead><tr><th>Учасник</th><th>Код</th><th>Запросив</th><th>Зароблено</th><th>Баланс</th><th>Роль</th><th></th></tr></thead><tbody id="pb"></tbody></table></div>';
      function draw(){
        var q = document.getElementById("pq").value.toLowerCase();
        document.getElementById("pb").innerHTML = list.filter(function(p){ return !q || [pname(p), p.tg_username, p.phone, p.ref_code].join(" ").toLowerCase().indexOf(q) >= 0; }).map(function(p){
          return '<tr><td><b>' + E(p.full_name || pname(p)) + '</b><small>' + E([p.tg_username ? "@" + p.tg_username : "", p.phone, p.city].filter(Boolean).join(" · ")) + '</small></td>' +
            '<td class="hide-m"><code>' + E(p.ref_code || "") + '</code></td><td class="hide-m">' + (p.invited || 0) + '</td><td class="hide-m money">' + E(M(p.earned)) + '</td>' +
            '<td class="money">' + E(M(p.balance)) + '</td>' +
            '<td class="hide-m">' + (isAdmin && p.id !== S.me.id ? '<select data-role="' + E(p.id) + '">' + opts([["user", "Користувач"], ["manager", "Менеджер"], ["admin", "Власник"]], p.role) + '</select>' : E(ROLES[p.role] || p.role)) + '</td>' +
            '<td><button class="btn ghost sm" data-hist="' + E(p.id) + '">Історія</button> ' + (p.balance > 0 ? '<button class="btn sm green" data-pay="' + E(p.id) + '">Виплатити</button>' : "") + '</td></tr>';
        }).join("") || '<tr><td colspan="7" class="empty">Поки нікого</td></tr>';
        document.querySelectorAll("[data-pay]").forEach(function(b){ b.onclick = function(){ payDialog(b.getAttribute("data-pay"), null); }; });
        document.querySelectorAll("[data-hist]").forEach(function(b){ b.textContent = "Анкета й історія"; b.onclick = function(){ histDialog(b.getAttribute("data-hist")); }; });
        document.querySelectorAll("[data-role]").forEach(function(sel){ sel.onchange = function(){ API.setRole(sel.getAttribute("data-role"), sel.value).then(function(){ toast("Роль змінено"); }).catch(fail); }; });
      }
      document.getElementById("pq").oninput = draw; draw();
    }).catch(fail);
  }
  function personById(id){ return S.people.filter(function(p){ return p.id === id; })[0] || (S.payouts.filter(function(r){ return r.user_id === id; })[0] || {}).user || {id: id}; }
  function payDialog(uid, req){
    var p = personById(uid), r = req ? S.payouts.filter(function(x){ return x.id === req; })[0] : null;
    var bal = r ? r.balance : p.balance;
    openDrawer('<div class="dh"><h2>Виплата: ' + E(pname(p)) + '</h2><button class="btn ghost sm" data-x>✕</button></div><div class="db">' +
      '<dl class="kv"><dt>Баланс</dt><dd class="money">' + E(M(bal)) + '</dd>' + (r ? '<dt>Запит</dt><dd>' + E(M(r.amount)) + ' · ' + E(dt(r.created_at, true)) + '</dd><dt>Зв’язок</dt><dd>' + E(r.contact || "—") + '</dd>' : "") +
      (p.phone ? '<dt>Телефон</dt><dd>' + E(p.phone) + '</dd>' : "") + (p.tg_username ? '<dt>Telegram</dt><dd><a href="https://t.me/' + E(p.tg_username) + '" target="_blank">@' + E(p.tg_username) + '</a></dd>' : "") + '</dl>' +
      '<div class="fld"><label>Сума, грн</label><input id="p-am" type="number" min="1" value="' + (r ? r.amount : Math.max(bal, 0)) + '"></div>' +
      '<div class="fld"><label>Коментар (як виплатили)</label><input id="p-note" placeholder="Напр. переказ на картку 16.11"></div>' +
      '<p class="note">Сума спишеться з балансу учасника, і він побачить виплату в кабінеті.</p></div>' +
      '<div class="df"><button class="btn ghost" data-x>Скасувати</button><button class="btn green" id="p-ok">Підтвердити виплату</button></div>');
    drawer.querySelectorAll("[data-x]").forEach(function(b){ b.onclick = closeDrawer; });
    document.getElementById("p-ok").onclick = function(){
      var a = parseInt(document.getElementById("p-am").value, 10);
      if (!(a > 0)) { toast("Вкажіть суму"); return; }
      if (a > bal && !confirm("Сума більша за баланс. Все одно виплатити?")) return;
      API.makePayout(uid, a, document.getElementById("p-note").value.trim() || "Виплата", req).then(function(){ toast("Виплату записано"); closeDrawer(); counts(); render(); }).catch(fail);
    };
  }
  function histDialog(uid){
    var p = personById(uid);
    API.ledger(uid).then(function(g){
      openDrawer('<div class="dh"><h2>' + E(pname(p)) + '</h2><button class="btn ghost sm" data-x>✕</button></div><div class="db">' +
        anketaHtml(p) + '<dl class="kv"><dt>Код</dt><dd><code>' + E(p.ref_code || "") + '</code></dd><dt>Посилання</dt><dd>' + E(location.origin + "/?ref=" + (p.ref_code || "")) + '</dd><dt>Баланс</dt><dd class="money">' + E(M(p.balance)) + '</dd></dl>' +
        '<b>Рух коштів</b><ul class="hist">' + (g.length ? g.map(function(x){ return '<li>' + E(dt(x.created_at, true)) + ' · ' + E({bonus: "Бонус", payout: "Виплата", adjust: "Коригування"}[x.kind] || x.kind) + ' <b>' + (x.amount > 0 ? "+" : "") + E(M(x.amount)) + '</b>' + (x.note ? " · " + E(x.note) : "") + '</li>'; }).join("") : "<li>Порожньо</li>") + '</ul>' +
        '<b>Запрошені</b><ul class="hist">' + (S.leads.filter(function(l){ return l.referrer_id === uid; }).map(function(l){ return '<li>' + E(l.name) + ' · ' + E(LSN[l.status]) + '</li>'; }).join("") || "<li>Нікого</li>") + '</ul></div>');
      drawer.querySelectorAll("[data-x]").forEach(function(b){ b.onclick = closeDrawer; });
    }).catch(fail);
  }

  /* ================= Виплати ================= */
  function rPayouts(){
    Promise.all([API.payouts(), API.people()]).then(function(r){
      S.payouts = r[0]; S.people = r[1];
      var nw = r[0].filter(function(x){ return x.status === "new"; }), old = r[0].filter(function(x){ return x.status !== "new"; });
      function rows(list, actions){
        return list.length ? list.map(function(x){
          return '<tr><td class="hide-m">' + E(dt(x.created_at, true)) + '</td><td><b>' + E(pname(x.user)) + '</b><small>' + E(x.contact || "") + '</small></td><td class="money">' + E(M(x.amount)) + '</td>' +
            '<td class="hide-m money">' + E(M(x.balance)) + '</td><td>' + (actions ? '<button class="btn sm green" data-ok="' + x.id + '">Виплачено</button> <button class="btn sm ghost" data-no="' + x.id + '">Відхилити</button>'
            : '<span class="st st-' + x.status + '">' + (x.status === "done" ? "Виплачено" : "Відхилено") + '</span>') + '</td></tr>';
        }).join("") : '<tr><td colspan="5" class="empty">' + (actions ? "Нових запитів немає" : "Порожньо") + '</td></tr>';
      }
      var head = '<thead><tr><th>Дата</th><th>Учасник</th><th>Сума</th><th>Баланс</th><th></th></tr></thead>';
      app.innerHTML = demoBar() + '<h3>Нові запити на виплату</h3><div class="card"><table class="tbl">' + head + '<tbody>' + rows(nw, true) + '</tbody></table></div>' +
        '<h3 style="margin-top:24px">Оброблені</h3><div class="card"><table class="tbl">' + head + '<tbody>' + rows(old, false) + '</tbody></table></div>';
      document.querySelectorAll("[data-ok]").forEach(function(b){ b.onclick = function(){ var x = S.payouts.filter(function(p){ return p.id === +b.getAttribute("data-ok"); })[0]; payDialog(x.user_id, x.id); }; });
      document.querySelectorAll("[data-no]").forEach(function(b){ b.onclick = function(){ if (confirm("Відхилити запит?")) API.rejectPayout(+b.getAttribute("data-no")).then(function(){ counts(); rPayouts(); }).catch(fail); }; });
    }).catch(fail);
  }

  /* ================= Налаштування ================= */
  function rSettings(){
    API.settings().then(function(st){
      S.st = st;
      var isAdmin = S.me.role === "admin", dis = isAdmin ? "" : " disabled";
      var base = +st.bonus_base || 2000, step = +st.bonus_step || 200, mx = +st.bonus_max || 4000;
      var ex = []; for (var i = 0; i < 6; i++) ex.push((i + 1) + "-й — " + M(Math.min(base + step * i, mx)));
      app.innerHTML = demoBar() + '<div class="card" style="padding:20px;max-width:620px;display:grid;gap:12px"><h3 style="margin:0">Бонус «Приведи друга»</h3>' +
        '<div class="g2"><div class="fld"><label>Перший друг у місяці, грн</label><input id="s-base" type="number" min="0" value="' + base + '"' + dis + '></div>' +
        '<div class="fld"><label>Кожен наступний — більше на, грн</label><input id="s-step" type="number" min="0" value="' + step + '"' + dis + '></div></div>' +
        '<div class="fld"><label>Максимум за одного друга, грн</label><input id="s-max" type="number" min="0" value="' + mx + '"' + dis + '></div>' +
        '<p class="note">Зараз: ' + E(ex.join(" · ")) + ' … і так до максимуму ' + E(M(mx)) + '. Щомісяця (за київським часом) відлік починається знову.</p>' +
        '<p class="note">Бонус нараховується автоматично, коли кандидату, який прийшов за посиланням, ставлять статус «Відпрацював 2 тижні, оплату отримано».</p>' +
        (isAdmin ? '<button class="btn" id="s-save" style="justify-self:start">Зберегти</button>' : '<p class="note">Змінювати може лише адміністратор.</p>') + '</div>' +
        '<div class="card" style="padding:20px;max-width:620px;margin-top:16px;display:grid;gap:10px"><h3 style="margin:0">Менеджери</h3>' +
        '<div class="fld"><label>Telegram-ніки менеджерів (через кому, без @)</label><textarea id="s-mgr" placeholder="ivan_manager, olena_vdalo"' + dis + '>' + E(st.manager_tg || "") + '</textarea></div>' +
        '<p class="note">Людина з цим ніком, увійшовши на сайті через Telegram (значок кабінету або /crm/), одразу потрапить у CRM як менеджер. Прибрати доступ — змініть роль на «Користувач» у вкладці «Реферали й баланси».</p>' +
        (isAdmin ? '<button class="btn" id="s-mgr-save" style="justify-self:start">Зберегти менеджерів</button>' : '') + '</div>';
      var ms = document.getElementById("s-mgr-save");
      if (ms) ms.onclick = function(){
        var list = document.getElementById("s-mgr").value.split(/[\s,]+/).map(function(x){ return x.trim().replace(/^@/, "").toLowerCase(); }).filter(Boolean);
        API.setSetting("manager_tg", list.join(", ")).then(function(){ return API.promoteManagers(list); })
          .then(function(){ toast("Менеджерів збережено"); rSettings(); }).catch(fail);
      };
      var sv = document.getElementById("s-save");
      if (sv) sv.onclick = function(){
        var v = function(id){ return Math.max(0, parseInt(document.getElementById(id).value, 10) || 0); };
        Promise.all([API.setSetting("bonus_base", v("s-base")), API.setSetting("bonus_step", v("s-step")), API.setSetting("bonus_max", v("s-max"))])
          .then(function(){ toast("Збережено"); rSettings(); }).catch(fail);
      };
    }).catch(fail);
  }

  boot();
})();
</script>
</body>
</html>
