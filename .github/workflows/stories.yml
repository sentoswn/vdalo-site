# Щоранку малює 3 сторіс для Instagram (tools/stories/stories.py) і надсилає їх
# власникам (адміни CRM) від бота @vdalo_robota_bot разом із підказками,
# яке посилання чи стікер додати. Нових секретів не потрібно.
name: Сторіс на день

on:
  schedule:
    - cron: "41 6 * * *"   # ~08:41 за Києвом (взимку), ~09:41 влітку
  push:
    branches: [main]
    paths: [tools/stories/**, .github/workflows/stories.yml]
  workflow_dispatch:
    inputs:
      day:
        description: "Дата YYYY-MM-DD (порожньо — сьогодні)"
        required: false
      days:
        description: "Скільки днів надіслати одразу (7 = тиждень)"
        required: false
        default: "1"

concurrency: stories

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Render
        env: {TZ: Europe/Kyiv}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 tools/stories/stories.py --out out --days ${{ github.event.inputs.days || '1' }} ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }}
      - name: Send to Telegram
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BOT" ]; then echo "Секрети не задано — пропускаю."; exit 0; fi
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null
          chats=$(psql "$DB_URL" -X -q -A -t -c "select tg_id from public.profiles where role='admin' and tg_id is not null")
          if [ -f out/tips.txt ]; then dirs="out"; else dirs=$(ls -d out/*/ | sort); fi
          for c in $chats; do
            for d in $dirs; do
              d=${d%/}; t=$(cat "$d/title.txt")
              media=$(python3 -c 'import json,sys; t=sys.argv[1]; print(json.dumps([{"type":"document","media":f"attach://s{i}", **({"caption":t+" — сторіс"} if i==1 else {})} for i in (1,2,3)]))' "$t")
              curl -s -o /dev/null -w "$t files %{http_code}\n" "https://api.telegram.org/bot${BOT}/sendMediaGroup" \
                -F chat_id="$c" -F media="$media" \
                -F "s1=@$d/story-1.jpg;filename=$t — 1 вакансія.jpg" -F "s2=@$d/story-2.jpg;filename=$t — 2 порада.jpg" -F "s3=@$d/story-3.jpg;filename=$t — 3 опитування.jpg"
              curl -s -o /dev/null -w "$t tips %{http_code}\n" "https://api.telegram.org/bot${BOT}/sendMessage" \
                --data-urlencode chat_id="$c" --data-urlencode text@$d/tips.txt -d disable_web_page_preview=true
              sleep 2
            done
          done
      - uses: actions/upload-artifact@v4
        with: {name: stories, path: out, retention-days: 7}
